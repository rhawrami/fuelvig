name: Update gas prices

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-gas-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check scraper before network access
        run: |
          node --test tests/test_fetch_aaa.mjs
          uv run --frozen pytest tests/test_update_prices.py

      - name: Fetch AAA pages
        run: node scripts/fetch_aaa.mjs "$RUNNER_TEMP/aaa-home.html" "$RUNNER_TEMP/aaa-states.html"

      - name: Update prices
        run: >-
          uv run --frozen python -m scripts.update_prices
          --home-html "$RUNNER_TEMP/aaa-home.html"
          --states-html "$RUNNER_TEMP/aaa-states.html"

      - name: Validate repository
        run: |
          node --test tests/test_calculations.mjs
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest

      - name: Detect price changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/prices)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit price changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/prices/raw/gas_prices_db.json \
            data/prices/raw/daily \
            data/prices/processed/prices.json
          git commit -m "data: update gas prices"
          git push

      - name: Deploy updated data
        if: steps.changes.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main -f ref="$(git rev-parse HEAD)"
        env:
          GH_TOKEN: ${{ github.token }}
